name: Deploy Multiple Branches to Pages

on:
  push:
    branches:
      - main
      - fa26

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Main branch to the default workspace root (keeps .git folder healthy)
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Checkout Fa26 branch to an external temporary workspace entirely outside
      - name: Checkout Fa26 Branch
        uses: actions/checkout@v4
        with:
          ref: fa26
          path: external-temp-fa26

      # 3. Create the fa26 subfolder inside the root workspace and safely copy files
      - name: Merge Fa26 Branch into Subfolder
        run: |
          mkdir -p fa26
          # Copy all fa26 files except its own .git configuration
          rsync -av --exclude='.git' external-temp-fa26/ fa26/
          # Clean up the external temp folder so it doesn't get deployed
          rm -rf external-temp-fa26

      # 4. Deploy the default workspace root directly
      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Deploys the current working directory which now includes the dev/ folder
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}